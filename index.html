<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polar Orbit Tracks</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 25px;
    }
    .grid {
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      width: 340px;
    }
    .card h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: #58a6ff;
    }
    .card img {
      width: 100%;
      height: auto;
      border-radius: 4px;
      display: block;
      background-color: #0d1117;
      min-height: 200px;
    }
  </style>
</head>
<body>

  <h1>Latest Global Polar Orbit Tracks</h1>

  <div class="grid">
    <div class="card">
      <h2>NOAA-21 (N21)</h2>
      <img id="img-n21" alt="NOAA-21 Orbit Track">
    </div>

    <div class="card">
      <h2>NOAA-20 (N20)</h2>
      <img id="img-n20" alt="NOAA-20 Orbit Track">
    </div>

    <div class="card">
      <h2>Suomi-NPP (NPP)</h2>
      <img id="img-npp" alt="Suomi-NPP Orbit Track">
    </div>
  </div>

  <script>
    async function loadLatestImage(satId, imgElementId) {
      // Append a cache-busting timestamp to guarantee real-time data
      const cacheBuster = new Date().getTime();
      const ssecUrl = `https://www.ssec.wisc.edu/datacenter/polar_orbit_tracks/get_image.php?sat=${satId}&reg=GLOBAL&ts=${cacheBuster}`;

      try {
        const response = await fetch(ssecUrl);
        const blob = await response.blob();
        
        // Convert binary image response directly to an in-memory object URL
        const objectUrl = URL.createObjectURL(blob);
        document.getElementById(imgElementId).src = objectUrl;
      } catch (err) {
        // Direct image URL fallback if fetch stream is restricted by browser policy
        document.getElementById(imgElementId).src = ssecUrl;
      }
    }

    // Load active real-time tracks
    loadLatestImage('NOAA21', 'img-n21');
    loadLatestImage('NOAA20', 'img-n20');
    loadLatestImage('SNPP', 'img-npp');
  </script>

</body>
</html>
