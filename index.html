<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polar Orbit Tracks</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 25px;
    }
    .grid {
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      width: 340px;
    }
    .card h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: #58a6ff;
    }
    .card img {
      width: 100%;
      height: auto;
      border-radius: 4px;
      display: block;
      background-color: #0d1117;
      min-height: 200px;
    }
  </style>
</head>
<body>

  <h1>Latest Global Polar Orbit Tracks</h1>

  <div class="grid">
    <div class="card">
      <h2>NOAA-21 (N21)</h2>
      <img id="img-n21" alt="NOAA-21 Orbit Track">
    </div>

    <div class="card">
      <h2>NOAA-20 (JPSS-1)</h2>
      <img id="img-n20" alt="NOAA-20 Orbit Track">
    </div>

    <div class="card">
      <h2>Suomi-NPP (NPP)</h2>
      <img id="img-npp" alt="Suomi-NPP Orbit Track">
    </div>
  </div>

  <script>
    function getSsecFolderString(date) {
      const year = date.getUTCFullYear();
      const month = String(date.getUTCMonth() + 1).padStart(2, '0');
      const day = String(date.getUTCDate()).padStart(2, '0');
      
      const startOfYear = new Date(Date.UTC(year, 0, 1));
      const dayOfYear = String(Math.floor((date - startOfYear) / (24 * 60 * 60 * 1000)) + 1).padStart(3, '0');
      
      return `${year}/${year}_${month}_${day}_${dayOfYear}`;
    }

    function loadSatWithFallback(imgElement, satName, daysBack = 2) {
      const baseUrl = 'https://www.ssec.wisc.edu/datacenter/polar_orbit_tracks/data';
      
      // Calculate target date based on days offset
      const targetDate = new Date(Date.now() - (daysBack * 86400000));
      const folder = getSsecFolderString(targetDate);
      
      imgElement.src = `${baseUrl}/${satName}/${folder}/GLOBAL.gif`;

      // Recurse backwards up to 7 days if SSEC hasn't updated the directory
      imgElement.onerror = function() {
        if (daysBack < 7) {
          loadSatWithFallback(this, satName, daysBack + 1);
        } else {
          this.onerror = null; // Prevent infinite loops
        }
      };
    }

    function setSatelliteImages() {
      const satellites = {
        'img-n21': 'NOAA21',
        'img-n20': 'JPSS-1',
        'img-npp': 'NPP' // SSEC directory path is 'NPP'
      };

      for (const [imgId, satName] of Object.entries(satellites)) {
        const imgElement = document.getElementById(imgId);
        loadSatWithFallback(imgElement, satName, 2); // Start 2 days back for reliable active runs
      }
    }

    setSatelliteImages();
  </script>

</body>
</html>
