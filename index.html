<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polar Orbit Tracks</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 25px;
    }
    .grid {
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
    .card h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: #58a6ff;
    }
    .card img {
      width: 100%;
      max-width: 400px;
      height: auto;
      border-radius: 4px;
      display: block;
    }
  </style>
</head>
<body>

  <h1>Latest Global Polar Orbit Tracks</h1>

  <div class="grid">
    <div class="card">
      <h2>NOAA-21 (N21)</h2>
      <img src="https://www.ssec.wisc.edu/datacenter/polar_orbit_tracks/get_image.php?sat=NOAA21&reg=GLOBAL" alt="NOAA-21 Orbit Track">
    </div>

    <div class="card">
      <h2>NOAA-20 (N20)</h2>
      <img src="https://www.ssec.wisc.edu/datacenter/polar_orbit_tracks/get_image.php?sat=NOAA20&reg=GLOBAL" alt="NOAA-20 Orbit Track">
    </div>

    <div class="card">
      <h2>Suomi-NPP (NPP)</h2>
      <img src="https://www.ssec.wisc.edu/datacenter/polar_orbit_tracks/get_image.php?sat=SNPP&reg=GLOBAL" alt="Suomi-NPP Orbit Track">
    </div>
  </div>

</body>
</html>
