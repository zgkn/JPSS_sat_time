<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polar Orbit Tracks - Southeast Asia</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 25px;
    }
    .grid {
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      width: 340px;
    }
    .card h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: #58a6ff;
    }
    /* Crop container focused specifically on Southeast Asia */
    .crop-container {
      width: 100%;
      height: 280px;
      overflow: hidden;
      border-radius: 4px;
      background-color: #0d1117;
      position: relative;
    }
    .crop-container img {
      width: 380%; /* Increased zoom level */
      height: auto;
      position: absolute;
      top: -58%;   /* Centered vertically on Indochina & Maritime SEA */
      left: -202%; /* Shifted West to align 90°E - 130°E */
      display: block;
    }
    .date-label {
      font-size: 0.85rem;
      color: #8b949e;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <h1>Today's Polar Orbit Tracks (Southeast Asia)</h1>

  <div class="grid">
    <div class="card">
      <h2>NOAA-21 (N21)</h2>
      <div class="crop-container">
        <img id="img-n21" alt="NOAA-21 Orbit Track">
      </div>
      <div id="date-n21" class="date-label"></div>
    </div>

    <div class="card">
      <h2>NOAA-20 (JPSS-1)</h2>
      <div class="crop-container">
        <img id="img-n20" alt="NOAA-20 Orbit Track">
      </div>
      <div id="date-n20" class="date-label"></div>
    </div>

    <div class="card">
      <h2>Suomi-NPP (NPP)</h2>
      <div class="crop-container">
        <img id="img-npp" alt="Suomi-NPP Orbit Track">
      </div>
      <div id="date-npp" class="date-label"></div>
    </div>
  </div>

  <script>
    function getSsecFolderString(date) {
      const year = date.getUTCFullYear();
      const month = String(date.getUTCMonth() + 1).padStart(2, '0');
      const day = String(date.getUTCDate()).padStart(2, '0');
      
      const startOfYear = new Date(Date.UTC(year, 0, 1));
      const dayOfYear = String(Math.floor((date - startOfYear) / (24 * 60 * 60 * 1000)) + 1).padStart(3, '0');
      
      return {
        path: `${year}/${year}_${month}_${day}_${dayOfYear}`,
        displayDate: `${year}-${month}-${day}`
      };
    }

    function loadTodaySatTrack(imgElement, labelElement, satName, offsetDays = 0) {
      const baseUrl = 'https://www.ssec.wisc.edu/datacenter/polar_orbit_tracks/data';
      
      const targetDate = new Date(Date.now() + (offsetDays * 86400000));
      const folderInfo = getSsecFolderString(targetDate);
      
      imgElement.src = `${baseUrl}/${satName}/${folderInfo.path}/GLOBAL.gif`;
      labelElement.textContent = `Date (UTC): ${folderInfo.displayDate}`;

      // Fallback to previous day if today's upload is delayed
      imgElement.onerror = function() {
        if (offsetDays > -3) {
          loadTodaySatTrack(this, labelElement, satName, offsetDays - 1);
        } else {
          this.onerror = null;
          labelElement.textContent = 'Track unavailable';
        }
      };
    }

    function setSatelliteImages() {
      const satellites = {
        'n21': 'NOAA21',
        'n20': 'JPSS-1',
        'npp': 'NPP'
      };

      for (const [key, satName] of Object.entries(satellites)) {
        const imgElement = document.getElementById(`img-${key}`);
        const labelElement = document.getElementById(`date-${key}`);
        
        loadTodaySatTrack(imgElement, labelElement, satName, 0); 
      }
    }

    setSatelliteImages();
  </script>

</body>
</html>
